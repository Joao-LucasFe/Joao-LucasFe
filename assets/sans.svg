<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 32" width="192" height="256" shape-rendering="crispEdges">
  <!-- Sans from Undertale - Pixel Art Sprite -->
  <!-- Each pixel = 1 unit -->

  <!-- === HEAD (skull) === -->
  <!-- Row 0-1: top of skull -->
  <rect x="8" y="0" width="8" height="1" fill="#FFFFFF"/>
  <rect x="7" y="1" width="10" height="1" fill="#FFFFFF"/>
  <!-- Row 2 -->
  <rect x="6" y="2" width="12" height="1" fill="#FFFFFF"/>
  <!-- Row 3: eye sockets row top -->
  <rect x="5" y="3" width="14" height="1" fill="#FFFFFF"/>
  <!-- Row 4: eyes -->
  <rect x="5" y="4" width="2" height="1" fill="#FFFFFF"/>
  <rect x="7" y="4" width="2" height="1" fill="#000000"/>
  <rect x="9" y="4" width="6" height="1" fill="#FFFFFF"/>
  <rect x="15" y="4" width="2" height="1" fill="#000000"/>
  <rect x="17" y="4" width="2" height="1" fill="#FFFFFF"/>
  <!-- Row 5: eye glow (left eye cyan) -->
  <rect x="5" y="5" width="2" height="1" fill="#FFFFFF"/>
  <rect x="7" y="5" width="1" height="1" fill="#00D4FF"/>
  <rect x="8" y="5" width="1" height="1" fill="#000000"/>
  <rect x="9" y="5" width="6" height="1" fill="#FFFFFF"/>
  <rect x="15" y="5" width="2" height="1" fill="#000000"/>
  <rect x="17" y="5" width="2" height="1" fill="#FFFFFF"/>
  <!-- Row 6 -->
  <rect x="5" y="6" width="14" height="1" fill="#FFFFFF"/>
  <!-- Row 7: nose -->
  <rect x="5" y="7" width="4" height="1" fill="#FFFFFF"/>
  <rect x="9" y="7" width="1" height="1" fill="#C0C0C0"/>
  <rect x="10" y="7" width="4" height="1" fill="#FFFFFF"/>
  <rect x="14" y="7" width="1" height="1" fill="#C0C0C0"/>
  <rect x="15" y="7" width="4" height="1" fill="#FFFFFF"/>
  <!-- Row 8: mouth/grin -->
  <rect x="6" y="8" width="12" height="1" fill="#FFFFFF"/>
  <!-- Row 9: teeth -->
  <rect x="6" y="9" width="1" height="1" fill="#FFFFFF"/>
  <rect x="7" y="9" width="1" height="1" fill="#C0C0C0"/>
  <rect x="8" y="9" width="1" height="1" fill="#FFFFFF"/>
  <rect x="9" y="9" width="1" height="1" fill="#C0C0C0"/>
  <rect x="10" y="9" width="1" height="1" fill="#FFFFFF"/>
  <rect x="11" y="9" width="1" height="1" fill="#C0C0C0"/>
  <rect x="12" y="9" width="1" height="1" fill="#FFFFFF"/>
  <rect x="13" y="9" width="1" height="1" fill="#C0C0C0"/>
  <rect x="14" y="9" width="1" height="1" fill="#FFFFFF"/>
  <rect x="15" y="9" width="1" height="1" fill="#C0C0C0"/>
  <rect x="16" y="9" width="1" height="1" fill="#FFFFFF"/>
  <rect x="17" y="9" width="1" height="1" fill="#C0C0C0"/>
  <!-- Row 10: chin -->
  <rect x="7" y="10" width="10" height="1" fill="#FFFFFF"/>

  <!-- === HOODIE === -->
  <!-- Row 11: hood -->
  <rect x="4" y="11" width="16" height="1" fill="#3565A4"/>
  <!-- Row 12 -->
  <rect x="3" y="12" width="18" height="1" fill="#3565A4"/>
  <!-- Row 13: hoodie with white shirt visible -->
  <rect x="3" y="13" width="4" height="1" fill="#3565A4"/>
  <rect x="7" y="13" width="10" height="1" fill="#EEEEEE"/>
  <rect x="17" y="13" width="4" height="1" fill="#3565A4"/>
  <!-- Row 14 -->
  <rect x="3" y="14" width="4" height="1" fill="#3565A4"/>
  <rect x="7" y="14" width="10" height="1" fill="#EEEEEE"/>
  <rect x="17" y="14" width="4" height="1" fill="#3565A4"/>
  <!-- Row 15 -->
  <rect x="3" y="15" width="4" height="1" fill="#3565A4"/>
  <rect x="7" y="15" width="10" height="1" fill="#EEEEEE"/>
  <rect x="17" y="15" width="4" height="1" fill="#3565A4"/>
  <!-- Row 16-18: hoodie body -->
  <rect x="4" y="16" width="16" height="1" fill="#3565A4"/>
  <rect x="4" y="17" width="16" height="1" fill="#3565A4"/>
  <rect x="5" y="18" width="14" height="1" fill="#3565A4"/>

  <!-- === ARMS (hoodie sleeves) === -->
  <!-- Left arm -->
  <rect x="1" y="13" width="2" height="1" fill="#3565A4"/>
  <rect x="0" y="14" width="3" height="1" fill="#3565A4"/>
  <rect x="0" y="15" width="3" height="1" fill="#3565A4"/>
  <rect x="1" y="16" width="2" height="1" fill="#3565A4"/>
  <!-- Right arm -->
  <rect x="21" y="13" width="2" height="1" fill="#3565A4"/>
  <rect x="21" y="14" width="3" height="1" fill="#3565A4"/>
  <rect x="21" y="15" width="3" height="1" fill="#3565A4"/>
  <rect x="21" y="16" width="2" height="1" fill="#3565A4"/>

  <!-- === HANDS (bones) === -->
  <rect x="0" y="17" width="3" height="1" fill="#FFFFFF"/>
  <rect x="21" y="17" width="3" height="1" fill="#FFFFFF"/>

  <!-- === SHORTS === -->
  <rect x="6" y="19" width="5" height="1" fill="#222222"/>
  <rect x="13" y="19" width="5" height="1" fill="#222222"/>
  <rect x="6" y="20" width="5" height="1" fill="#222222"/>
  <rect x="13" y="20" width="5" height="1" fill="#222222"/>
  <rect x="7" y="21" width="4" height="1" fill="#222222"/>
  <rect x="13" y="21" width="4" height="1" fill="#222222"/>

  <!-- === LEGS (bones) === -->
  <rect x="7" y="22" width="3" height="1" fill="#FFFFFF"/>
  <rect x="14" y="22" width="3" height="1" fill="#FFFFFF"/>
  <rect x="7" y="23" width="3" height="1" fill="#FFFFFF"/>
  <rect x="14" y="23" width="3" height="1" fill="#FFFFFF"/>

  <!-- === SLIPPERS === -->
  <rect x="5" y="24" width="6" height="2" fill="#F5C6D0"/>
  <rect x="13" y="24" width="6" height="2" fill="#F5C6D0"/>
</svg>
